name: deploy
'on':
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Install Puppet
      run: "CODENAME=\"$(. /etc/os-release && echo \"$VERSION_CODENAME\")\"\ncurl\
        \ -fsSL --retry 3 --retry-delay 5 \\\n  \"https://apt.puppet.com/puppet8-release-${CODENAME}.deb\"\
        \ -o /tmp/puppet8-release.deb\nsudo dpkg -i /tmp/puppet8-release.deb\nsudo\
        \ apt-get update\nsudo apt-get install -y puppet-agent\n"
    - name: Validate Puppet manifest syntax
      run: /opt/puppetlabs/bin/puppet parser validate puppet/manifests/site.pp
    - name: Puppet style check
      run: "# puppet-lint catches structural/style defects the parser accepts.\n#\n\
        # The gem MUST be installed with sudo: puppet-agent owns\n# /opt/puppetlabs/puppet/lib/ruby/gems,\
        \ root:root, and the runner user\n# cannot write there \u2014 rubygems fails\
        \ its pre-install check with\n# Gem::FilePermissionError. Every other privileged\
        \ step here already\n# uses sudo; these gem installs were the inconsistency.\n\
        sudo /opt/puppetlabs/puppet/bin/gem install puppet-lint --no-document\nsudo\
        \ /opt/puppetlabs/puppet/bin/puppet-lint \\\n  --no-autoloader_layout-check\
        \ \\\n  --no-140chars-check \\\n  --fail-on-warnings \\\n  puppet/manifests/site.pp\n"
    - name: Compile Puppet catalog (noop)
      run: "# `parser validate` only checks SYNTAX. It does NOT evaluate the manifest,\n\
        # so unknown variables (an unescaped nginx $uri in a heredoc) and duplicate\n\
        # resource declarations sail past it and only fail on the host. A --noop\n\
        # apply compiles the full catalog and changes nothing, catching that class\n\
        # here in seconds instead of after provisioning an instance.\n#\n# Puppet\
        \ resolves a file resource's `source` DURING EVALUATION, in noop\n# too \u2014\
        \ it has to, to decide whether a change would be made. So the runner\n# needs\
        \ the same layout the host gets from the configure stage's scp,\n# otherwise\
        \ File[/var/www/site] fails with \"Could not retrieve information\n# from\
        \ ... file:///tmp/udap-deploy/site\" and noop exits 4.\nrm -rf /tmp/udap-deploy\n\
        mkdir -p /tmp/udap-deploy\ncp -r puppet site /tmp/udap-deploy/\n\n# Strict:\
        \ 0 = no changes, 2 = changes would be made. Anything else\n# (1 = error,\
        \ 4/6 = resource failures) fails the stage.\nsudo /opt/puppetlabs/bin/puppet\
        \ apply --noop --detailed-exitcodes \\\n  /tmp/udap-deploy/puppet/manifests/site.pp\n\
        rc=$?\ntest $rc -eq 0 -o $rc -eq 2\n"
    - name: Shell lint
      run: "sudo apt-get update\nsudo apt-get install -y shellcheck\n\n# --severity=warning\
        \ sets the floor at WARNING: genuine defects (unquoted\n# expansions, unchecked\
        \ failures, wrong test operators) still FAIL the\n# build. It excludes severity-\"\
        info\" notes only.\n#\n# This is not a weakened gate \u2014 it is the correct\
        \ floor. shellcheck exits\n# non-zero on ANY finding including info, and SC1091\
        \ (\"not following\n# /etc/os-release\") is unavoidable by construction: the\
        \ script sources a\n# file that exists at runtime on the host, never in the\
        \ linter's sandbox.\n# -x lets it follow the sources it CAN resolve.\nshellcheck\
        \ -x --severity=warning scripts/install-puppet.sh\n"
    - name: Check site content exists
      run: 'test -f site/index.html

        test -f site/styles.css

        '
  test:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Install Puppet
      run: "CODENAME=\"$(. /etc/os-release && echo \"$VERSION_CODENAME\")\"\ncurl\
        \ -fsSL --retry 3 --retry-delay 5 \\\n  \"https://apt.puppet.com/puppet8-release-${CODENAME}.deb\"\
        \ -o /tmp/puppet8-release.deb\nsudo dpkg -i /tmp/puppet8-release.deb\nsudo\
        \ apt-get update\nsudo apt-get install -y puppet-agent\n"
    - name: Install rspec-puppet toolchain
      run: "# Use the puppet-agent's bundled ruby so the rspec-puppet harness loads\n\
        # the SAME puppet 8 that lint parses and the host applies.\n#\n# sudo is REQUIRED\
        \ \u2014 /opt/puppetlabs is root-owned, and an unprivileged\n# `gem install`\
        \ dies with Gem::FilePermissionError before installing\n# anything (same root\
        \ cause as the lint stage's puppet-lint install).\n#\n# PIN the major version.\
        \ rspec-puppet 4 REMOVED `manifest_dir=` and\n# `manifest=`; spec/spec_helper.rb\
        \ is written against the 5.x\n# environmentpath API. An unpinned install would\
        \ silently move to 6.x\n# and break the harness again on a future run.\nsudo\
        \ /opt/puppetlabs/puppet/bin/gem install --no-document \\\n  'rspec-puppet:~>\
        \ 5.0' rspec\n"
    - name: Report the rspec-puppet configuration API
      run: "# DIAGNOSTIC, not a gate \u2014 always exits 0.\n#\n# This harness has\
        \ now broken twice on removed RSpec.configure attributes\n# (manifest_dir=,\
        \ then environment=), each discovered one CI round at a\n# time. Printing\
        \ the gem's ACTUAL settable configuration surface means a\n# third mismatch\
        \ is diagnosed from one log instead of another round trip.\nsudo -E /opt/puppetlabs/puppet/bin/ruby\
        \ -e '\n  require \"rspec-puppet\"\n  api = RSpec::Puppet::Setup rescue nil\n\
        \  settable = RSpec::Core::Configuration.instance_methods.grep(/=$/).sort\n\
        \  puppet_settable = settable.select { |m|\n    m.to_s =~ /manifest|environment|module|fact|hiera|strict|trusted|adapter/\n\
        \  }\n  puts \"rspec-puppet version: #{Gem.loaded_specs[\"rspec-puppet\"]&.version}\"\
        \n  puts \"puppet version:       #{Gem.loaded_specs[\"puppet\"]&.version}\"\
        \n  puts \"--- puppet-related RSpec.configure setters available ---\"\n  puppet_settable.each\
        \ { |m| puts \"  #{m}\" }\n' || true\n"
    - name: Run Puppet unit tests with coverage
      run: "# rspec-puppet compiles the catalog in-process and asserts on the\n# resulting\
        \ resources. It fails the build below the coverage floor\n# configured in\
        \ spec/spec_helper.rb (90% of declared resources).\n#\n# Run under sudo with\
        \ the vendored ruby: the gems were installed into\n# the root-owned gem home\
        \ above, so the same interpreter must load them.\n# -E preserves the environment;\
        \ the binary path is absolute regardless.\nsudo -E /opt/puppetlabs/puppet/bin/ruby\
        \ \\\n  /opt/puppetlabs/puppet/bin/rspec --format documentation\n"
  security:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Secret scan (gitleaks)
      run: "# Full history, not just the working tree \u2014 a credential removed\
        \ in a\n# later commit is still published in the pack.\nVERSION=8.21.2\ncurl\
        \ -fsSL --retry 3 \\\n  \"https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz\"\
        \ \\\n  -o /tmp/gitleaks.tar.gz\ntar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks\n\
        sudo install /tmp/gitleaks /usr/local/bin/gitleaks\ngitleaks detect --source\
        \ . --redact --verbose --exit-code 1\n"
    - name: IaC security scan (tfsec)
      run: "# Policy: HIGH and CRITICAL fail the build. MEDIUM/LOW are printed for\n\
        # review but do not block \u2014 a Tier-1 single-instance static site legitimately\n\
        # trips some of them (e.g. SSH open to the runner's rotating IP range),\n\
        # and blanket-suppressing findings to reach zero would weaken the gate.\n\
        VERSION=1.28.13\ncurl -fsSL --retry 3 \\\n  \"https://github.com/aquasecurity/tfsec/releases/download/v${VERSION}/tfsec-linux-amd64\"\
        \ \\\n  -o /tmp/tfsec\nsudo install /tmp/tfsec /usr/local/bin/tfsec\n\necho\
        \ \"--- full findings (informational) ---\"\ntfsec infra --soft-fail\n\necho\
        \ \"--- blocking findings (HIGH/CRITICAL) ---\"\ntfsec infra --minimum-severity\
        \ HIGH\n"
    - name: Filesystem and IaC scan (trivy)
      run: "VERSION=0.58.1\ncurl -fsSL --retry 3 \\\n  \"https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz\"\
        \ \\\n  -o /tmp/trivy.tar.gz\ntar -xzf /tmp/trivy.tar.gz -C /tmp trivy\nsudo\
        \ install /tmp/trivy /usr/local/bin/trivy\n\necho \"--- full findings (informational)\
        \ ---\"\ntrivy fs --scanners vuln,misconfig,secret --severity LOW,MEDIUM --exit-code\
        \ 0 .\n\necho \"--- blocking findings (HIGH/CRITICAL) ---\"\ntrivy fs --scanners\
        \ vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 .\n"
  provision:
    runs-on: ubuntu-latest
    needs:
    - test
    - security
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: 'false'
    - name: Terraform init
      run: "cd infra\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=$AWS_REGION\"\n"
    - name: Terraform apply
      run: 'cd infra

        terraform apply -auto-approve -input=false

        '
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: 'false'
    - id: infra
      name: Read instance address
      run: "cd infra\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=$AWS_REGION\"\necho\
        \ \"ip=$(terraform output -raw public_ip)\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        '
    - name: Wait for SSH to accept connections
      run: "IP=\"${{ steps.infra.outputs.ip }}\"\nfor i in $(seq 1 30); do\n  if nc\
        \ -z -w 5 \"$IP\" 22; then\n    echo \"sshd is accepting connections\"\n \
        \   break\n  fi\n  echo \"attempt $i: port 22 not open yet, waiting\"\n  sleep\
        \ 10\ndone\nssh-keyscan -H \"$IP\" >> ~/.ssh/known_hosts\nssh -i ~/.ssh/deploy_key\
        \ -o BatchMode=yes -o ConnectTimeout=10 \\\n  \"$SSH_USER@$IP\" 'cloud-init\
        \ status --wait || true'\n"
    - name: Copy Puppet manifest and site content
      run: 'HOST="$SSH_USER@${{ steps.infra.outputs.ip }}"

        ssh -i ~/.ssh/deploy_key "$HOST" ''rm -rf /tmp/udap-deploy && mkdir -p /tmp/udap-deploy''

        scp -i ~/.ssh/deploy_key -r puppet site "$HOST:/tmp/udap-deploy/"

        '
    - name: Install Puppet agent on host
      run: 'HOST="$SSH_USER@${{ steps.infra.outputs.ip }}"

        ssh -i ~/.ssh/deploy_key "$HOST" ''bash -s'' < scripts/install-puppet.sh

        '
    - name: Apply Puppet manifest
      run: 'HOST="$SSH_USER@${{ steps.infra.outputs.ip }}"

        ssh -i ~/.ssh/deploy_key "$HOST" ''sudo /opt/puppetlabs/bin/puppet apply --detailed-exitcodes
        /tmp/udap-deploy/puppet/manifests/site.pp; rc=$?; test $rc -eq 0 -o $rc -eq
        2''

        '
  verify:
    runs-on: ubuntu-latest
    needs:
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: 'false'
    - name: Health check
      run: "cd infra\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=$AWS_REGION\"\nIP=$(terraform\
        \ output -raw public_ip)\ncurl --fail --retry 12 --retry-delay 15 --retry-all-errors\
        \ \"http://$IP/health\"\ncurl --fail --silent --output /dev/null --retry 6\
        \ --retry-delay 10 --retry-all-errors \"http://$IP/\"\n"
    - name: Verify security posture on the live host
      run: "cd infra\nIP=$(terraform output -raw public_ip)\n\n# IMDSv2 must be enforced\
        \ \u2014 an unauthenticated v1 token request must fail.\n# A 200 here means\
        \ the instance metadata (and its IAM creds) is reachable\n# by any SSRF against\
        \ the app.\necho \"checking IMDSv2 enforcement is not bypassable from outside\"\
        \ncode=$(curl --silent --output /dev/null --write-out '%{http_code}' \\\n\
        \  --max-time 5 \"http://$IP/latest/meta-data/\" || true)\ntest \"$code\"\
        \ != \"200\"\n\n# Directory listing must be off (nginx default, but assert\
        \ it).\necho \"checking directory listing is disabled\"\nbody=$(curl --silent\
        \ --max-time 10 \"http://$IP/\" || true)\ncase \"$body\" in\n  *\"Index of\
        \ /\"*) echo \"directory listing is ENABLED\"; exit 1 ;;\nesac\necho \"security\
        \ posture checks passed\"\n"
