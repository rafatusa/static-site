version: 1
name: static-site
vcs: github
stages:
- id: lint
  kind: lint
  timeout_minutes: 10
  steps:
  - name: Install Puppet
    run: |
      CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
      curl -fsSL --retry 3 --retry-delay 5 \
        "https://apt.puppet.com/puppet8-release-${CODENAME}.deb" -o /tmp/puppet8-release.deb
      sudo dpkg -i /tmp/puppet8-release.deb
      sudo apt-get update
      sudo apt-get install -y puppet-agent
  - name: Validate Puppet manifest syntax
    run: /opt/puppetlabs/bin/puppet parser validate puppet/manifests/site.pp
  - name: Puppet style check
    run: |
      # puppet-lint catches structural/style defects the parser accepts.
      #
      # The gem MUST be installed with sudo: puppet-agent owns
      # /opt/puppetlabs/puppet/lib/ruby/gems, root:root, and the runner user
      # cannot write there — rubygems fails its pre-install check with
      # Gem::FilePermissionError. Every other privileged step here already
      # uses sudo; these gem installs were the inconsistency.
      sudo /opt/puppetlabs/puppet/bin/gem install puppet-lint --no-document
      sudo /opt/puppetlabs/puppet/bin/puppet-lint \
        --no-autoloader_layout-check \
        --no-140chars-check \
        --fail-on-warnings \
        puppet/manifests/site.pp
  - name: Compile Puppet catalog (noop)
    run: |
      # `parser validate` only checks SYNTAX. It does NOT evaluate the manifest,
      # so unknown variables (an unescaped nginx $uri in a heredoc) and duplicate
      # resource declarations sail past it and only fail on the host. A --noop
      # apply compiles the full catalog and changes nothing, catching that class
      # here in seconds instead of after provisioning an instance.
      #
      # Puppet resolves a file resource's `source` DURING EVALUATION, in noop
      # too — it has to, to decide whether a change would be made. So the runner
      # needs the same layout the host gets from the configure stage's scp,
      # otherwise File[/var/www/site] fails with "Could not retrieve information
      # from ... file:///tmp/udap-deploy/site" and noop exits 4.
      rm -rf /tmp/udap-deploy
      mkdir -p /tmp/udap-deploy
      cp -r puppet site /tmp/udap-deploy/

      # Strict: 0 = no changes, 2 = changes would be made. Anything else
      # (1 = error, 4/6 = resource failures) fails the stage.
      sudo /opt/puppetlabs/bin/puppet apply --noop --detailed-exitcodes \
        /tmp/udap-deploy/puppet/manifests/site.pp
      rc=$?
      test $rc -eq 0 -o $rc -eq 2
  - name: Shell lint
    run: |
      sudo apt-get update
      sudo apt-get install -y shellcheck

      # --severity=warning sets the floor at WARNING: genuine defects (unquoted
      # expansions, unchecked failures, wrong test operators) still FAIL the
      # build. It excludes severity-"info" notes only.
      #
      # This is not a weakened gate — it is the correct floor. shellcheck exits
      # non-zero on ANY finding including info, and SC1091 ("not following
      # /etc/os-release") is unavoidable by construction: the script sources a
      # file that exists at runtime on the host, never in the linter's sandbox.
      # -x lets it follow the sources it CAN resolve.
      shellcheck -x --severity=warning scripts/install-puppet.sh
  - name: Check site content exists
    run: |
      test -f site/index.html
      test -f site/styles.css
- id: test
  kind: test
  needs:
  - lint
  timeout_minutes: 15
  steps:
  - name: Install Puppet
    run: |
      CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
      curl -fsSL --retry 3 --retry-delay 5 \
        "https://apt.puppet.com/puppet8-release-${CODENAME}.deb" -o /tmp/puppet8-release.deb
      sudo dpkg -i /tmp/puppet8-release.deb
      sudo apt-get update
      sudo apt-get install -y puppet-agent
  - name: Install rspec-puppet toolchain
    run: |
      # Use the puppet-agent's bundled ruby so the rspec-puppet harness loads
      # the SAME puppet 8 that lint parses and the host applies.
      #
      # sudo is REQUIRED — /opt/puppetlabs is root-owned, and an unprivileged
      # `gem install` dies with Gem::FilePermissionError before installing
      # anything (same root cause as the lint stage's puppet-lint install).
      #
      # PIN the major version. rspec-puppet 4 REMOVED `manifest_dir=` (but NOT
      # `manifest=`, which spec/spec_helper.rb depends on). An unpinned install
      # would silently move to 6.x and break the harness again on a future run.
      sudo /opt/puppetlabs/puppet/bin/gem install --no-document \
        'rspec-puppet:~> 5.0' rspec
  - name: Run Puppet unit tests with coverage
    run: |
      # rspec-puppet compiles the catalog in-process and asserts on the
      # resulting resources. It fails the build below the coverage floor
      # configured in spec/spec_helper.rb (90% of declared resources), and
      # spec/hosts/site_spec.rb fails the run outright if the catalog came back
      # empty — an empty catalog reports 100% coverage of zero resources and
      # would otherwise pass the floor while asserting nothing.
      #
      # The path argument is REQUIRED, not cosmetic. A bare `rspec` runs the
      # whole spec/ tree; an obsolete spec left behind by a rename then executes
      # alongside the real suite and fails on an API it was never updated for.
      # Scoping to spec/hosts means only the maintained suite ever runs.
      #
      # Run under sudo with the vendored ruby: the gems were installed into
      # the root-owned gem home above, so the same interpreter must load them.
      # -E preserves the environment; the binary path is absolute regardless.
      sudo -E /opt/puppetlabs/puppet/bin/ruby \
        /opt/puppetlabs/puppet/bin/rspec \
        --default-path spec \
        --format documentation \
        spec/hosts
- id: security
  kind: security
  needs:
  - lint
  timeout_minutes: 15
  steps:
  - name: Secret scan (gitleaks)
    run: |
      # ┌──────────────────────────────────────────────────────────────────┐
      # │ BLOCKING GATE — restored 2026-08-27 at the user's request, after │
      # │ a period of report-only operation.                               │
      # │                                                                  │
      # │ Any secret gitleaks finds FAILS the build. There is no severity  │
      # │ floor for a leaked credential.                                   │
      # │                                                                  │
      # │ The two known SG findings are NOT suppressed here — they are     │
      # │ handled by two narrow, rule-scoped `tfsec:ignore` comments in    │
      # │ infra/ec2.tf, each documenting why. Nothing else is exempt.      │
      # │                                                                  │
      # │ A failed scanner INSTALL is fatal. Under report-only it was not, │
      # │ because the output was the only product; now the exit code is    │
      # │ the product, and a scanner that never ran must never report      │
      # │ green.                                                           │
      # └──────────────────────────────────────────────────────────────────┘
      VERSION=8.21.2
      curl -fsSL --retry 3 --retry-delay 5 \
        "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
        -o /tmp/gitleaks.tar.gz
      tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      gitleaks version

      echo "=== gitleaks: secret scan across full history (BLOCKING) ==="
      gitleaks detect --source . --redact --verbose --exit-code 1
  - name: IaC security scan (tfsec)
    run: |
      # BLOCKING at the HIGH floor. See the banner in the gitleaks step.
      #
      # Two findings are accepted via rule-scoped ignores in infra/ec2.tf:
      #   aws-ec2-no-public-ingress-sgr  (SSH from rotating GitHub runner IPs)
      #   aws-ec2-no-public-egress-sgr   (apt / apt.puppet.com / github.com)
      # Both are annotated at the exact block with the reason. VERIFIED on a
      # real tfsec v1.28.13 run: with the ignores present the scan reports
      # `ignored 5, critical 0` and exits 0, while an UNRELATED new HIGH
      # (an unencrypted EBS volume) still exits 1. The gate is narrow, not off.
      #
      # Do NOT add --soft-fail here, and do NOT broaden the ignores to a
      # resource- or file-level exemption. Fix new findings, or add a new
      # single-rule ignore with its own written justification.
      VERSION=1.28.13
      curl -fsSL --retry 3 --retry-delay 5 \
        "https://github.com/aquasecurity/tfsec/releases/download/v${VERSION}/tfsec-linux-amd64" \
        -o /tmp/tfsec
      sudo install /tmp/tfsec /usr/local/bin/tfsec
      tfsec --version

      # Full inventory first, so the log always shows the whole picture
      # including the accepted ignores and every LOW/MEDIUM note.
      echo "=== tfsec: full findings inventory (informational) ==="
      tfsec infra --no-colour --soft-fail

      echo "=== tfsec: HIGH/CRITICAL gate (BLOCKING) ==="
      tfsec infra --no-colour --minimum-severity HIGH
  - name: Filesystem and IaC scan (trivy)
    run: |
      # BLOCKING at the HIGH floor. See the banner in the gitleaks step.
      #
      # Install via the OFFICIAL INSTALLER, not a hand-written release-asset
      # URL. A previous pinned URL
      #   .../v0.58.1/trivy_0.58.1_Linux-64bit.tar.gz
      # returned 404 and killed this step under `bash -e` before trivy ran.
      # The installer resolves the correct asset for the platform itself.
      curl -fsSL --retry 3 --retry-delay 5 \
        https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
        -o /tmp/install-trivy.sh
      sudo sh /tmp/install-trivy.sh -b /usr/local/bin
      trivy --version

      echo "=== trivy: full findings inventory (informational) ==="
      trivy fs --scanners vuln,misconfig,secret \
        --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 .

      # trivy reads the same tfsec:ignore comments for misconfig checks, so the
      # two accepted SG findings stay suppressed here too without a second
      # exemption list to keep in sync.
      echo "=== trivy: HIGH/CRITICAL gate (BLOCKING) ==="
      trivy fs --scanners vuln,misconfig,secret \
        --severity HIGH,CRITICAL --exit-code 1 .
- id: provision
  kind: provision
  needs:
  - test
  - security
  timeout_minutes: 30
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: us-east-1
    TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  steps:
  - name: Set up Terraform
    uses: hashicorp/setup-terraform@v3
    with:
      terraform_wrapper: 'false'
  - name: Terraform init
    run: |
      cd infra
      terraform init -input=false -reconfigure \
        -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
        -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
        -backend-config="region=$AWS_REGION"
  - name: Terraform apply
    run: |
      cd infra
      terraform apply -auto-approve -input=false
- id: configure
  kind: configure
  needs:
  - provision
  timeout_minutes: 30
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: us-east-1
    SSH_USER: ${{ secrets.SSH_USER }}
    SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  steps:
  - name: Set up Terraform
    uses: hashicorp/setup-terraform@v3
    with:
      terraform_wrapper: 'false'
  - name: Read instance address
    id: infra
    run: |
      cd infra
      terraform init -input=false -reconfigure \
        -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
        -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
        -backend-config="region=$AWS_REGION"
      echo "ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
  - name: Write SSH key
    run: |
      mkdir -p ~/.ssh
      printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
      chmod 600 ~/.ssh/deploy_key
  - name: Wait for SSH to accept connections
    run: |
      IP="${{ steps.infra.outputs.ip }}"
      for i in $(seq 1 30); do
        if nc -z -w 5 "$IP" 22; then
          echo "sshd is accepting connections"
          break
        fi
        echo "attempt $i: port 22 not open yet, waiting"
        sleep 10
      done
      ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts
      ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 \
        "$SSH_USER@$IP" 'cloud-init status --wait || true'
  - name: Copy Puppet manifest and site content
    run: |
      HOST="$SSH_USER@${{ steps.infra.outputs.ip }}"
      ssh -i ~/.ssh/deploy_key "$HOST" 'rm -rf /tmp/udap-deploy && mkdir -p /tmp/udap-deploy'
      scp -i ~/.ssh/deploy_key -r puppet site "$HOST:/tmp/udap-deploy/"
  - name: Install Puppet agent on host
    run: |
      HOST="$SSH_USER@${{ steps.infra.outputs.ip }}"
      ssh -i ~/.ssh/deploy_key "$HOST" 'bash -s' < scripts/install-puppet.sh
  - name: Apply Puppet manifest
    run: |
      HOST="$SSH_USER@${{ steps.infra.outputs.ip }}"
      ssh -i ~/.ssh/deploy_key "$HOST" 'sudo /opt/puppetlabs/bin/puppet apply --detailed-exitcodes /tmp/udap-deploy/puppet/manifests/site.pp; rc=$?; test $rc -eq 0 -o $rc -eq 2'
  - name: Assert IMDSv2 is enforced on the instance
    run: |
      # IMDS lives at the LINK-LOCAL address 169.254.169.254, which is
      # reachable ONLY FROM INSIDE the instance. This check therefore belongs
      # here, in the stage that has SSH, and NOT in verify.
      #
      # A previous rev asserted this from the runner against the instance's
      # PUBLIC ip (http://<public-ip>/latest/meta-data/). That request never
      # reached IMDS at all — it hit nginx, whose `try_files ... /index.html`
      # fallback served the landing page with 200, and the assertion failed.
      # Worse, had it returned non-200 it would have PASSED while testing
      # nothing: no external request can observe IMDS configuration.
      #
      # Two assertions, because either alone is vacuous:
      #   1. no token  -> 401  (v1 is refused: http_tokens = "required")
      #   2. token PUT -> 200  (IMDS is actually reachable, so the 401 above
      #                         means enforcement and not a broken/absent IMDS)
      HOST="$SSH_USER@${{ steps.infra.outputs.ip }}"

      echo "IMDSv1 (no token) must be refused with 401"
      code=$(ssh -i ~/.ssh/deploy_key "$HOST" \
        "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://169.254.169.254/latest/meta-data/")
      echo "  got: $code"
      test "$code" = "401"

      echo "IMDSv2 token endpoint must succeed with 200"
      token_code=$(ssh -i ~/.ssh/deploy_key "$HOST" \
        "curl -s -X PUT -o /dev/null -w '%{http_code}' --max-time 5 -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token")
      echo "  got: $token_code"
      test "$token_code" = "200"

      echo "IMDSv2 enforcement confirmed"
- id: verify
  kind: verify
  needs:
  - configure
  timeout_minutes: 15
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: us-east-1
  steps:
  - name: Set up Terraform
    uses: hashicorp/setup-terraform@v3
    with:
      terraform_wrapper: 'false'
  - name: Health check
    run: |
      cd infra
      terraform init -input=false -reconfigure \
        -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
        -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
        -backend-config="region=$AWS_REGION"
      IP=$(terraform output -raw public_ip)
      curl --fail --retry 12 --retry-delay 15 --retry-all-errors "http://$IP/health"
      curl --fail --silent --output /dev/null --retry 6 --retry-delay 10 --retry-all-errors "http://$IP/"
  - name: Verify externally observable posture
    run: |
      cd infra
      IP=$(terraform output -raw public_ip)

      # Only assert what an EXTERNAL client can actually observe. IMDSv2 is
      # NOT in that set (link-local, instance-only) and is asserted over SSH in
      # the configure stage instead.

      # The document root must not be browsable. This ALSO guards the recursive
      # -mode bug that once made nginx 403 everything: a 200 with real content
      # and no listing is the property we want.
      echo "checking directory listing is disabled"
      body=$(curl --silent --max-time 10 "http://$IP/" || true)
      case "$body" in
        *"Index of /"*) echo "directory listing is ENABLED"; exit 1 ;;
      esac

      # The landing page must be real HTML, not an error body served with 200.
      echo "checking / serves HTML content"
      ctype=$(curl --silent --output /dev/null --write-out '%{content_type}' \
        --max-time 10 "http://$IP/")
      echo "  content-type: $ctype"
      case "$ctype" in
        text/html*) ;;
        *) echo "unexpected content-type for /"; exit 1 ;;
      esac

      echo "external posture checks passed"
rollback:
  strategy: rerun
