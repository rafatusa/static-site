version: 1
name: static-site
vcs: github
stages:
- id: lint
  kind: lint
  timeout_minutes: 10
  steps:
  - name: Install Puppet
    run: |
      CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
      curl -fsSL --retry 3 --retry-delay 5 \
        "https://apt.puppet.com/puppet8-release-${CODENAME}.deb" -o /tmp/puppet8-release.deb
      sudo dpkg -i /tmp/puppet8-release.deb
      sudo apt-get update
      sudo apt-get install -y puppet-agent
  - name: Validate Puppet manifest syntax
    run: /opt/puppetlabs/bin/puppet parser validate puppet/manifests/site.pp
  - name: Check site content exists
    run: |
      test -f site/index.html
      test -f site/styles.css
- id: provision
  kind: provision
  needs:
  - lint
  timeout_minutes: 30
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: us-east-1
    TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  steps:
  - name: Set up Terraform
    uses: hashicorp/setup-terraform@v3
    with:
      terraform_wrapper: 'false'
  - name: Terraform init
    run: |
      cd infra
      terraform init -input=false -reconfigure \
        -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
        -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
        -backend-config="region=$AWS_REGION"
  - name: Terraform apply
    run: |
      cd infra
      terraform apply -auto-approve -input=false
- id: configure
  kind: configure
  needs:
  - provision
  timeout_minutes: 30
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: us-east-1
    SSH_USER: ${{ secrets.SSH_USER }}
    SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  steps:
  - name: Set up Terraform
    uses: hashicorp/setup-terraform@v3
    with:
      terraform_wrapper: 'false'
  - name: Read instance address
    id: infra
    run: |
      cd infra
      terraform init -input=false -reconfigure \
        -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
        -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
        -backend-config="region=$AWS_REGION"
      echo "ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
  - name: Write SSH key
    run: |
      mkdir -p ~/.ssh
      printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
      chmod 600 ~/.ssh/deploy_key
  - name: Wait for SSH to accept connections
    run: |
      IP="${{ steps.infra.outputs.ip }}"
      for i in $(seq 1 30); do
        if nc -z -w 5 "$IP" 22; then
          echo "sshd is accepting connections"
          break
        fi
        echo "attempt $i: port 22 not open yet, waiting"
        sleep 10
      done
      ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts
      ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 \
        "$SSH_USER@$IP" 'cloud-init status --wait || true'
  - name: Copy Puppet manifest and site content
    run: |
      HOST="$SSH_USER@${{ steps.infra.outputs.ip }}"
      ssh -i ~/.ssh/deploy_key "$HOST" 'rm -rf /tmp/udap-deploy && mkdir -p /tmp/udap-deploy'
      scp -i ~/.ssh/deploy_key -r puppet site "$HOST:/tmp/udap-deploy/"
  - name: Install Puppet agent on host
    run: |
      HOST="$SSH_USER@${{ steps.infra.outputs.ip }}"
      ssh -i ~/.ssh/deploy_key "$HOST" 'bash -s' < scripts/install-puppet.sh
  - name: Apply Puppet manifest
    run: |
      HOST="$SSH_USER@${{ steps.infra.outputs.ip }}"
      ssh -i ~/.ssh/deploy_key "$HOST" 'sudo /opt/puppetlabs/bin/puppet apply --detailed-exitcodes /tmp/udap-deploy/puppet/manifests/site.pp; rc=$?; test $rc -eq 0 -o $rc -eq 2'
- id: verify
  kind: verify
  needs:
  - configure
  timeout_minutes: 15
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: us-east-1
  steps:
  - name: Set up Terraform
    uses: hashicorp/setup-terraform@v3
    with:
      terraform_wrapper: 'false'
  - name: Health check
    run: |
      cd infra
      terraform init -input=false -reconfigure \
        -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
        -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
        -backend-config="region=$AWS_REGION"
      IP=$(terraform output -raw public_ip)
      curl --fail --retry 12 --retry-delay 15 --retry-all-errors "http://$IP/health"
      curl --fail --silent --output /dev/null --retry 6 --retry-delay 10 --retry-all-errors "http://$IP/"
rollback:
  strategy: rerun
